<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>razenishere</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #e6e6e6;
    --dim: #555;
    --accent: #ff2e2e;
  }
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
    overflow:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  body::before {
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(
      180deg,
      rgba(255,255,255,.015) 0 1px,
      transparent 1px 3px
    );
    pointer-events:none;
    z-index:10;
  }

  body::after {
    content:"";
    position:fixed; inset:0;
    box-shadow: inset 0 0 150px 20px rgba(0,0,0,.9);
    pointer-events:none;
    z-index:9;
  }

  .box{
    width:100%;
    max-width:520px;
    font-size:14px;
    line-height:1.8;
    position:relative;
    z-index:20;
  }

  h1{
    font-size:clamp(40px, 9vw, 64px);
    font-weight:500;
    letter-spacing:-.02em;
    margin:0 0 4px;
    color:#f0f0f0;
  }
  h1 em{font-style:normal; color:var(--accent)}

  .name{
    color:#8a8a8a;
    font-size:13px;
    letter-spacing:.08em;
    margin-bottom:32px;
  }

  .lines{
    border-left:1px solid #222;
    padding-left:18px;
    color:var(--dim);
    font-size:13px;
    margin-bottom:24px;
  }
  .lines div{padding:2px 0}
  .lines span{color:#cfcfcf}

  .term {
    font-size:12px;
    color:var(--dim);
    line-height:1.6;
    min-height: 1.6em;
    white-space: pre-wrap;
    word-break: break-all;
    margin-bottom: 28px;
  }
  .term .prompt { color: var(--accent); }
  .term .cmd { color: #e6e6e6; }
  .term .ok { color: #4af626; }
  .term .cursor {
    display:inline-block;
    width:7px; height:13px;
    background:var(--fg);
    vertical-align:middle;
    animation: blink 1s steps(1) infinite;
    margin-left:2px;
  }
  @keyframes blink { 50%{opacity:0} }

  .signature {
    border-top: 1px dashed #222;
    padding-top: 16px;
    font-size: 10px;
    line-height: 1.7;
    color: var(--dim);
    letter-spacing: .05em;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 16px;
  }
  .signature div { display: flex; justify-content: space-between; }
  .signature span:first-child { color: #333; text-transform: uppercase; }
  .signature span:last-child { color: #8a8a8a; }

  /* watermark biner di pojok */
  .watermark {
    position: fixed;
    right: 20px;
    bottom: 20px;
    font-size: 9px;
    line-height: 1.2;
    color: rgba(255,255,255,.04);
    pointer-events: none;
    z-index: 5;
    white-space: pre;
    font-family: monospace;
    letter-spacing: .1em;
  }

</style>
</head>
<body>

  <div class="watermark">
    01110010 01100001 01111010 01100101 01101110
    R A Z E N
  </div>

  <div class="box">
    <h1>pwned<em>.</em></h1>
    <div class="name">razen</div>

    <div class="lines">
      <div>host <span id="h">—</span></div>
      <div>date <span id="d">—</span></div>
    </div>

    <div class="term" id="term"></div>

    <div class="signature">
      <div><span>vector</span> <span id="v">—</span></div>
      <div><span>session</span> <span id="s">—</span></div>
      <div><span>handler</span> <span>razen</span></div>
      <div><span>exit</span> <span>clean</span></div>
    </div>

  </div>

<script>
  var now = new Date();
  var p = function(n){return n<10?"0"+n:n};
  document.getElementById("h").textContent = location.hostname || "—";
  document.getElementById("d").textContent =
    now.getFullYear() + "-" + p(now.getMonth()+1) + "-" + p(now.getDate())
    + " " + p(now.getHours()) + ":" + p(now.getMinutes());

  var rand = function(len) {
    var c = "0123456789abcdef";
    var r = "";
    for (var i = 0; i < len; i++) r += c[Math.floor(Math.random()*16)];
    return r;
  };
  document.getElementById("v").textContent = "0x" + rand(6);
  document.getElementById("s").textContent = rand(8);

  var term = document.getElementById("term");
  var host = location.hostname || "target";
  var lines = [
    { t: "razen@" + host + ":~# ", c: "cmd", typed: "whoami" },
    { t: "razen", c: "ok" },
    { t: "razen@" + host + ":~# ", c: "cmd", typed: "ls /var/www/html" },
    { t: "index.html  config.php  database.sql  .env", c: "ok" },
    { t: "razen@" + host + ":~# ", c: "cmd", typed: "cat flag.txt" },
    { t: "// nothing to prove. just passing through.", c: "ok" }
  ];

  var li = 0, ci = 0;
  var promptStr = "";
  var currentLine = "";

  function render() {
    term.innerHTML = promptStr + currentLine + '<span class="cursor"></span>';
  }

  function type() {
    if (li >= lines.length) {
      term.innerHTML = '<span class="prompt">razen@'+host+':~# </span><span class="cursor"></span>';
      return;
    }
    var line = lines[li];
    if (ci === 0) {
      promptStr = '<span class="prompt">' + line.t + '</span>';
      currentLine = "";
    }
    if (line.typed && ci < line.typed.length) {
      currentLine += line.typed[ci];
      ci++;
      render();
      setTimeout(type, 45 + Math.random()*40);
    } else if (line.typed && ci === line.typed.length) {
      promptStr += '<span class="cmd">' + line.typed + '</span>\n';
      currentLine = "";
      ci = 0;
      li++;
      setTimeout(type, 250);
    } else {
      promptStr = '<span class="ok">' + line.t + '</span>\n';
      term.innerHTML = promptStr;
      ci = 0;
      li++;
      setTimeout(type, 300);
    }
  }
  setTimeout(type, 300);
</script>
</body>
</html>
